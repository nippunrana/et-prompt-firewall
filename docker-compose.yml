# On the Mac: `docker compose up --build` builds local images for development.
# On the VPS: scripts/deploy.sh points each `:live` tag at the image CI built for a commit.
# The VPS never builds, and never runs `docker compose pull` (the :live tags are not in any registry).
name: et-prompt-firewall

services:
  firewall:
    build:
      context: ./services/firewall
      # Prompt Guard 2 is gated: the build downloads it with HF_TOKEN from .env. Only building needs
      # the token; the VPS never builds, so its .env does not hold it.
      secrets: [hf_token]
    image: et-prompt-firewall-firewall:live
    restart: unless-stopped
    environment:
      # The LLM judge (Gemini API) and the sandbox (OpenRouter). Optional: without them the firewall
      # decides on its detectors alone and says so in every answer that needed them.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      # The audit log (every decision at both checkpoints) and the tool-call guard's review log.
      - guard-review:/data
    # The VPS is shared with live apps: every service must keep its cpus and mem_limit caps.
    cpus: 1.0
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  demo-agent:
    build: ./services/demo-agent
    image: et-prompt-firewall-demo-agent:live
    restart: unless-stopped
    environment:
      FIREWALL_URL: http://firewall:8000
      # The agent's model. Optional: without it /run answers 503 and the rest of the stack still runs.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  web:
    build: ./web
    image: et-prompt-firewall-web:live
    restart: unless-stopped
    # The only published port, and only on localhost: Nginx proxies /projects/et-prompt-firewall here.
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      firewall:
        condition: service_healthy
      demo-agent:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/projects/et-prompt-firewall/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  guard-review:
